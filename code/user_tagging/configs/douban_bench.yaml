platform_name: "douban"
platform: douban
task: benchmark
min_original_text_len: 10

data_source:
  user_pool_filename: "{date}_bench_users.csv"

fetch_limits:
  max_count: 10

buffer_rules:
  trigger_threshold: 5
  max_posts_per_call: 50

quality_rules:
  anchor_density:
    lower_bound: 0.2
    upper_bound: 2.0
  behavior_risk:
    min_personality_ratio: 0.0
    min_avg_time_gap: 240
    repetition_threshold: 0.30
    fuzzy_repetition_threshold: 0.85
    coherence:
      low_threshold: 0.25
      high_threshold: 0.95

blacklist:
  enable: false

llm_service:
  mode: remote
  api_key: "${API_KEY}"
  base_url: "http://localhost:8000/v1"
  model_name: "deepseek-chat"
  embedding_model_path: "MARS_result/model/embedding/BAAI/bge-small-zh-v1.5"
  timeout: 120
