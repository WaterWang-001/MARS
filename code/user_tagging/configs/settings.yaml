# settings.yaml

# 1. LLM 服务配置 (全局统一，因为现在是单 Client 并行调用)
llm_service:
  mode: "remote"
  api_key: ""  # 本地服务通常不需要 Key
  base_url: "https://api.ai-gaochao.cn/v1" 
  model_name: "deepseek-v3"
  
  # 并发控制 (原 main.py 中的 MAX_WORKERS)
  max_workers: 10

# 2. 处理流程配置 (Pipeline Settings)
pipeline:
  # [Buffer] 触发阈值：积攒多少条帖子才调用 LLM
  trigger_threshold: 3
  
  # [Safety] 单次最大处理条数 (防止 Token 爆炸，截断最近的 N 条)
  max_posts_per_call: 20
  
  # [Quality] 质量校验阈值
  quality:
    repetition_threshold: 0.3  # 重复率 > 30% 视为垃圾
    min_avg_time_gap: 60       # 平均发帖间隔 < 60秒 视为刷屏

# 3. 任务Prompt配置 (可选，指向 prompt 文件目录)
prompts:
  dir: "src/prompts"

 

